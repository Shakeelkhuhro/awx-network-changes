---
- name: "BATFISH: Deep Visibility & Pre-Validation"
  hosts: localhost
  connection: local
  gather_facts: no
  tasks:
    - name: "VISIBILITY: Extract Network Facts"
      ansible.builtin.shell: |
        python3 -c "
        try:
            import pybatfish
            from pybatfish.client.official import bf_session, bf_set_network, bf_init_snapshot
            from pybatfish.question import bfq
            import json

            # Bridging to the Batfish container on the Host IP
            bf_session.host = '172.25.115.72' 
            
            bf_set_network('1link_prod')
            bf_init_snapshot('/tmp/batfish_snapshot/', name='live_state', overwrite=True)
            
            facts = bfq.nodeProperties().answer().frame().to_json(orient='records')
            with open('/tmp/network_facts.json', 'w') as f:
                f.write(facts)
            print('SUCCESS')
        except Exception as e:
            print(f'Runtime Error: {e}')
            import sys; sys.exit(1)
        "
      register: bf_python_output

    - name: "PRE-VALIDATION REPORT"
      ansible.builtin.debug:
        msg: "Batfish parsed config. Node details saved to /tmp/network_facts.json"

    - name: "Show Parsed Inventory"
      ansible.builtin.shell: "cat /tmp/network_facts.json"
      register: cat_output

    - name: "Display Results"
      ansible.builtin.debug:
        var: cat_output.stdout_lines
