---
- name: "PRE-REQUISITES: Prepare AWX Runner"
  hosts: localhost
  connection: local
  gather_facts: no
  tasks:
    - name: "Install PyBatfish"
      ansible.builtin.pip:
        name: pybatfish

- name: "BATFISH: Deep Visibility & Pre-Validation"
  hosts: localhost
  connection: local
  gather_facts: no
  tasks:
    - name: "VISIBILITY: Extract Network Facts"
      ansible.builtin.shell: |
        python3 -c "
        try:
            import pybatfish
            from pybatfish.client.commands import bf_session, bf_set_network, bf_init_snapshot
            from pybatfish.question import bfq
            import json

            # '192.168.x.x' rpleace to actual host's IP
            bf_session.host = '172.25.115.72' 
            
            bf_set_network('1link_prod')
            bf_init_snapshot('/tmp/batfish_snapshot/', name='live_state', overwrite=True)
            
            facts = bfq.nodeProperties().answer().frame().to_json(orient='records')
            with open('/tmp/network_facts.json', 'w') as f:
                f.write(facts)
            print('SUCCESS')
        except ImportError:
            # Fallback for different pybatfish versions
            from pybatfish.client.official import bf_session, bf_set_network, bf_init_snapshot
            bf_session.host = '192.168.1.50'
            bf_set_network('1link_prod')
            bf_init_snapshot('/tmp/batfish_snapshot/', name='live_state', overwrite=True)
            print('SUCCESS')
        "
      register: bf_python_output
