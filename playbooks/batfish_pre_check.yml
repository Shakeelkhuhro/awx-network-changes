---
- name: "BATFISH: Deep Visibility & Pre-Validation"
  hosts: localhost
  connection: local
  gather_facts: no
  tasks:
    - name: "VISIBILITY: Extract Network Facts using Python"
      ansible.builtin.shell: |
        python3 -c "
        from pybatfish.client.commands import bf_init_snapshot, bf_set_network, bf_session
        from pybatfish.question import bfq
        import json
        
        bf_session.host = 'localhost'
        bf_set_network('1link_prod')
        bf_init_snapshot('/tmp/batfish_snapshot/', name='live_state', overwrite=True)
        
        # Get Node and VLAN information
        facts = bfq.nodeProperties().answer().frame().to_json()
        with open('/tmp/network_facts.json', 'w') as f:
            f.write(facts)
        "
      register: bf_python_output

    - name: "PRE-VALIDATION REPORT"
      ansible.builtin.debug:
        msg: "Batfish has successfully parsed the configuration. Node details saved to /tmp/network_facts.json"

    - name: "DISPLAY: Current VLANs on Target"
      ansible.builtin.shell: "cat /tmp/network_facts.json"
      register: cat_output

    - name: "Show Parsed Inventory"
      ansible.builtin.debug:
        var: cat_output.stdout_lines
