---
- name: "PRE-REQUISITES: Prepare AWX Runner"
  hosts: localhost
  connection: local
  gather_facts: no
  tasks:
    - name: "Install PyBatfish"
      ansible.builtin.pip:
        name: pybatfish

- name: "BATFISH: Deep Visibility & Pre-Validation"
  hosts: localhost
  connection: local
  gather_facts: no
  tasks:
    - name: "VISIBILITY: Extract Network Facts using Python"
      ansible.builtin.shell: |
        python3 -c "
        import pybatfish
        from pybatfish.client.official import bf_session, bf_set_network, bf_init_snapshot
        from pybatfish.question import bfq
        import json
        import sys

        try:
            # Set connection to the Batfish service
            bf_session.host = 'localhost'
            
            # Initialize Network and Snapshot
            bf_set_network('1link_prod')
            bf_init_snapshot('/tmp/batfish_snapshot/', name='live_state', overwrite=True)
            
            # Extract Facts
            facts_frame = bfq.nodeProperties().answer().frame()
            facts_json = facts_frame.to_json(orient='records')
            
            with open('/tmp/network_facts.json', 'w') as f:
                f.write(facts_json)
            print('Successfully extracted facts')
        except Exception as e:
            print(f'Error occurred: {e}')
            sys.exit(1)
        "
      register: bf_python_output

    - name: "PRE-VALIDATION REPORT"
      ansible.builtin.debug:
        msg: "Batfish has successfully parsed the configuration. Node details saved to /tmp/network_facts.json"

    - name: "DISPLAY: Current VLANs on Target"
      ansible.builtin.shell: "cat /tmp/network_facts.json"
      register: cat_output

    - name: "Show Parsed Inventory"
      ansible.builtin.debug:
        var: cat_output.stdout_lines
