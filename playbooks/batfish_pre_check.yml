---
- name: "BATFISH: Deep Visibility & Pre-Validation"
  hosts: localhost
  connection: local
  tasks:
    - name: "Initialize Batfish Session"
      pybatfish.batfish.bf_session:
        host: "localhost"
        name: "1link_network"

    - name: "Load Live Snapshot"
      pybatfish.batfish.bf_init_snapshot:
        network: "1link_prod"
        snapshot: "live_state"
        snapshot_path: "/tmp/batfish_snapshot/"
        overwrite: true

    - name: "FACT EXTRACTION: Get All Network Details"
      pybatfish.batfish.bf_extract_facts:
        output_path: "/tmp/network_facts.json"

    - name: "VISIBILITY: Current VLAN & IP Inventory"
      debug:
        msg: >
          PRE-VALIDATION REPORT:
          Current Node: {{ item.key }}
          VLAN Database: {{ item.value.Configuration.Vlans.keys() | list }}
          Interfaces: {{ item.value.Configuration.Interfaces.keys() | list }}
      loop: "{{ lookup('file', '/tmp/network_facts.json') | from_json | json_query('nodes | dict2items') }}"
