---
- name: 1LINK Validation Engine
  hosts: all
  gather_facts: no
  # connection: network_cli (Inherited from AWX Template)

  vars:
    vlan_id_str: "{{ vlan_id | default('') | string }}"

  tasks:
    # ---------------------------
    # INPUT CHECKS
    # ---------------------------
    - name: Fail if critical variables are missing
      ansible.builtin.fail:
        msg: "Missing required variables: change_type or vlan_id"
      when: change_type is not defined or vlan_id is not defined

    # ---------------------------
    # VLAN VALIDATION
    # ---------------------------
    - name: Get current VLAN database
      cisco.ios.ios_command:
        commands:
          - show vlan brief
      register: vlan_output
      when: change_type in ['create_vlan', 'delete_vlan']

    - name: Check VLAN existence
      ansible.builtin.set_fact:
        vlan_exists: "{{ vlan_id_str in vlan_output.stdout[0] }}"
      when: change_type in ['create_vlan', 'delete_vlan']

    - name: PRE-CHECK FAIL: Prevent duplicate creation
      ansible.builtin.fail:
        msg: "VLAN {{ vlan_id }} already exists on the switch. Aborting creation."
      when:
        - change_type == 'create_vlan'
        - vlan_exists

    - name: PRE-CHECK FAIL: Prevent deletion of non-existent VLAN
      ansible.builtin.fail:
        msg: "VLAN {{ vlan_id }} not found on the switch. Aborting deletion."
      when:
        - change_type == 'delete_vlan'
        - not vlan_exists

    # ---------------------------
    # INTERFACE VALIDATION
    # ---------------------------
    - name: Get interface config
      cisco.ios.ios_command:
        commands:
          - show running-config interface {{ interface_name }}
      register: int_output
      when: change_type in ['interface_up', 'interface_down', 'update_description']

    - name: Fail if interface invalid
      ansible.builtin.fail:
        msg: "Interface {{ interface_name }} does not exist on this device."
      when:
        - change_type in ['interface_up', 'interface_down', 'update_description']
        - "'Invalid input' in int_output.stdout[0]"

    - name: Validation Passed
      ansible.builtin.debug:
        msg: "All checks passed for {{ change_type }} on VLAN/Interface {{ vlan_id | default(interface_name) }}"
