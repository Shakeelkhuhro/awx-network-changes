---
- name: 1LINK Rollback Engine
  hosts: all
  gather_facts: no
  connection: network_cli

  tasks:

    # ---------------------------
    # ROLLBACK VLAN CREATION
    # ---------------------------

    - name: Remove VLAN if create failed
      cisco.ios.ios_config:
        lines:
          - no vlan {{ vlan_id }}
      when: change_type == "create_vlan"

    - name: Verify VLAN Removed
      cisco.ios.ios_command:
        commands:
          - show vlan id {{ vlan_id }}
      register: vlan_removed
      when: change_type == "create_vlan"

    # ---------------------------
    # ROLLBACK INTERFACE UP
    # ---------------------------

    - name: Shutdown interface
      cisco.ios.ios_config:
        lines:
          - shutdown
        parents: interface {{ interface_name }}
      when: change_type == "interface_up"

    # ---------------------------
    # ROLLBACK INTERFACE DOWN
    # ---------------------------

    - name: Bring interface back up
      cisco.ios.ios_config:
        lines:
          - no shutdown
        parents: interface {{ interface_name }}
      when: change_type == "interface_down"

    # ---------------------------
    # ROLLBACK DESCRIPTION
    # ---------------------------

    - name: Restore previous description
      cisco.ios.ios_config:
        lines:
          - description {{ previous_description }}
        parents: interface {{ interface_name }}
      when: change_type == "update_description"

    # ---------------------------
    # FINAL STATUS
    # ---------------------------

    - name: Rollback completed
      debug:
        msg: "Rollback executed successfully for {{ change_type }}"
