# playbooks/rollback_change.yml
---
- name: 1LINK Rollback Engine
  hosts: all
  gather_facts: no
  connection: network_cli

  tasks:

    # ---------------------------
    # VLAN ROLLBACK
    # ---------------------------

    - name: Remove created VLAN
      cisco.ios.ios_config:
        lines:
          - no vlan {{ vlan_id }}
      when: change_type == 'create_vlan'

    - name: Check VLAN after rollback
      cisco.ios.ios_command:
        commands:
          - show vlan brief
      register: vlan_check
      when: change_type == 'create_vlan'

    - name: Confirm VLAN rollback
      debug:
        msg: "Rollback successful. VLAN {{ vlan_id }} removed"
      when:
        - change_type == 'create_vlan'
        - vlan_id|string not in vlan_check.stdout[0]

    # ---------------------------
    # INTERFACE UP ROLLBACK
    # ---------------------------

    - name: Shutdown interface again
      cisco.ios.ios_config:
        lines:
          - shutdown
        parents: interface {{ interface_name }}
      when: change_type == 'interface_up'

    # ---------------------------
    # INTERFACE DOWN ROLLBACK
    # ---------------------------

    - name: Bring interface back up
      cisco.ios.ios_config:
        lines:
          - no shutdown
        parents: interface {{ interface_name }}
      when: change_type == 'interface_down'

    # ---------------------------
    # DESCRIPTION ROLLBACK
    # ---------------------------

    - name: Restore old description
      cisco.ios.ios_config:
        lines:
          - description {{ previous_description | default('NONE') }}
        parents: interface {{ interface_name }}
      when: change_type == 'update_description'

    # ---------------------------
    # FINAL
    # ---------------------------

    - name: Rollback complete
      debug:
        msg: "Rollback executed for {{ change_type }}"


- name: Update iTop Ticket on Rollback/Failure
  hosts: localhost
  gather_facts: no

  tasks:

    - name: Update iTop Ticket
      ansible.builtin.uri:
        url: "{{ lookup('env', 'ITOP_URL') }}"
        method: POST
        body_format: form-urlencoded
        body:
          auth_token: "{{ lookup('env', 'ITOP_TOKEN') }}"
          json_data: >
            {
              "operation": "core/update",
              "class": "UserRequest",
              "key": "{{ itop_ticket_id }}",
              "fields": {
                "private_log": "AWX Automation failed. Rollback executed successfully.",
                "solution": "Change failed during {{ change_type }}. Manual intervention required."
              }
            }
      delegate_to: localhost
