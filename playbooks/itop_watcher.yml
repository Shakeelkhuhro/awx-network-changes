---
- name: Poll iTop for Resolved Tickets
  hosts: localhost
  connection: local
  gather_facts: no

  tasks:
    - name: Get Resolved User Requests from iTop
      ansible.builtin.uri:
        url: "{{ lookup('env', 'ITOP_URL') }}"
        method: POST
        body_format: form-urlencoded
        body:
          auth_token: "{{ lookup('env', 'ITOP_TOKEN') }}"
          json_data: >
            {
              "operation": "core/get",
              "class": "UserRequest",
              "key": "SELECT UserRequest WHERE status='resolved'",
              "output_fields": "id, title, description"
            }
      register: itop_response

    - name: Trigger the 1LINK Network Workflow
      awx.awx.workflow_launch:
        # This name must match the name in your AWX UI exactly
        name: "Change Approval Workflow"
        inventory: "iTop Managed Network"
        extra_vars:
          itop_ticket_id: "{{ item.fields.id }}"
          # Splits '100,Finance_VLAN' into two variables
          vlan_id: "{{ item.fields.description.split(',')[0] }}"
          vlan_name: "{{ item.fields.description.split(',')[1] | default('VLAN_' ~ item.fields.id) }}"
          change_type: "create_vlan"
      loop: "{{ itop_response.json.objects | dict2items | map(attribute='value') | list }}"
      # Only runs if iTop returned at least one ticket
      when: 
        - itop_response.json.code == 0 
        - itop_response.json.objects is not none
