- name: Poll iTop for Resolved Tickets
  hosts: localhost
  connection: local
  tasks:
    - name: Get Resolved User Requests from iTop
      ansible.builtin.uri:
        url: "{{ lookup('env', 'ITOP_URL') }}"
        method: POST
        body_format: form-urlencoded
        body:
          auth_token: "{{ lookup('env', 'ITOP_TOKEN') }}"
          json_data: >
            {
              "operation": "core/get",
              "class": "UserRequest",
              "key": "SELECT UserRequest WHERE status='resolved' AND service_name='Network Automation'",
              "output_fields": "id, title, description, function_alc_cis_list"
            }
      register: itop_response

    - name: Trigger Workflow if ticket exists
      ansible.builtin.debug:
        msg: "Found Ticket: {{ item.fields.id }}. Triggering Workflow now..."
      loop: "{{ itop_response.json.objects | dict2items | map(attribute='value') | list }}"
      when: itop_response.json.code == 0 and itop_response.json.objects is not none
