---
- name: 1LINK iTop Watcher
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    awx_url: "http://10.43.90.93/api/v2/workflow_job_templates/10/launch/"
    awx_username: "admin"
    awx_password: "Admin@123"
    awx_inventory: 4

  tasks:
    - name: Get resolved requests from iTop
      ansible.builtin.uri:
        url: "http://172.25.115.72/itop/webservices/rest.php?version=1.3"
        method: POST
        body_format: form-urlencoded
        body:
          auth_token: "{{ lookup('env', 'ITOP_TOKEN') }}"
          json_data: >
            {
              "operation": "core/get",
              "class": "UserRequest",
              "key": "SELECT UserRequest WHERE status='resolved'",
              "output_fields": "id,title,description"
            }
      register: itop_response

    - name: Launch AWX workflow for each resolved request
      vars:
        # We build a RAW JSON string manually. This is the "Old Reliable" method.
        # Notice there are NO quotes around the vlan_id value.
        raw_extra_vars: >-
          {
            "itop_ticket_id": "{{ item.fields.id }}",
            "change_type": "{{ 'delete_vlan' if 'delete' in item.fields.title | lower else 'create_vlan' if 'vlan' in item.fields.title | lower else 'update_description' }}",
            "vlan_id": {{ item.fields.title | regex_search('[0-9]+') | default(1) | int }},
            "vlan_name": "{{ item.fields.title | regex_replace(' ', '_') }}",
            "interface_name": "GigabitEthernet1/0/1"
          }
      ansible.builtin.uri:
        url: "{{ awx_url }}"
        method: POST
        user: "{{ awx_username }}"
        password: "{{ awx_password }}"
        force_basic_auth: true
        status_code: 201
        body_format: json
        body:
          inventory: "{{ awx_inventory | int }}"
          # We use from_json to turn our perfect string back into a real object
          extra_vars: "{{ raw_extra_vars | from_json }}"
      loop: "{{ itop_response.json.objects.values() | list if itop_response.json.objects else [] }}"
      when:
        - itop_response.json.code == 0
        - itop_response.json.objects is defined
