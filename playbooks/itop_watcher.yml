- name: Trigger Workflow via Direct API
      ansible.builtin.uri:
        url: "http://10.43.90.93/api/v2/workflow_job_templates/10/launch/"
        method: POST
        user: "admin"
        password: "Admin@123"
        force_basic_auth: yes
        status_code: 201
        body_format: json
        body: >
          {
            "inventory": 4,
            "extra_vars": {
              "itop_ticket_id": "{{ item.fields.id }}",
              "change_type": "{{ 'create_vlan' if 'create' in item.fields.title | lower 
                                 else 'delete_vlan' if 'delete' in item.fields.title | lower 
                                 else 'interface_up' if 'up' in item.fields.title | lower 
                                 else 'interface_down' if 'down' in item.fields.title | lower 
                                 else 'update_description' }}",
              "vlan_id": {{ item.fields.title | regex_replace('[^0-9]', '') | default(1) | int }},
              "interface_name": "GigabitEthernet1/0/1",
              "interface_description": "{{ item.fields.title }}"
            }
          }
      loop: "{{ itop_response.json.objects | dict2items | map(attribute='value') | list }}"
