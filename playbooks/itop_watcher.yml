---
- name: 1LINK iTop Watcher
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    awx_url: "http://10.43.90.93/api/v2/workflow_job_templates/10/launch/"
    awx_username: "admin"
    awx_password: "Admin@123"
    awx_inventory: 4

  tasks:
    - name: Get resolved requests from iTop
      ansible.builtin.uri:
        url: "http://172.25.115.72/itop/webservices/rest.php?version=1.3"
        method: POST
        body_format: form-urlencoded
        body:
          auth_token: "{{ lookup('env', 'ITOP_TOKEN') }}"
          json_data: >
            {
              "operation": "core/get",
              "class": "UserRequest",
              "key": "SELECT UserRequest WHERE status='resolved'",
              "output_fields": "id,title,description"
            }
      register: itop_response

    - name: Launch AWX workflow for each resolved request
      vars:
        # Pre-calculating values as native Python types
        vlan_int: "{{ (item.fields.title | regex_search('[0-9]+') | default(1)) | int }}"
        action_str: "{{ 'delete_vlan' if 'delete' in item.fields.title | lower else 'create_vlan' if 'vlan' in item.fields.title | lower else 'update_description' }}"
        
        # Creating the dictionary structure here
        payload_vars:
          itop_ticket_id: "{{ item.fields.id }}"
          change_type: "{{ action_str }}"
          vlan_id: "{{ vlan_int }}"
          vlan_name: "{{ item.fields.title | regex_replace(' ', '_') }}"
          interface_name: "GigabitEthernet1/0/1"

      ansible.builtin.uri:
        url: "{{ awx_url }}"
        method: POST
        user: "{{ awx_username }}"
        password: "{{ awx_password }}"
        force_basic_auth: true
        status_code: 201
        body_format: json
        body:
          inventory: "{{ awx_inventory | int }}"
          # The 'combine' ensures the dictionary is treated as a pure object
          extra_vars: "{{ payload_vars | combine({}) }}"
      loop: "{{ itop_response.json.objects.values() | list if itop_response.json.objects else [] }}"
      when:
        - itop_response.json.code == 0
        - itop_response.json.objects is defined
