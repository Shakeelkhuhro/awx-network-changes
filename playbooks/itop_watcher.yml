- name: Poll iTop for Resolved Tickets
  hosts: localhost
  connection: local
  gather_facts: no

  tasks:

    - name: Get Resolved User Requests from iTop
      ansible.builtin.uri:
        url: "{{ lookup('env', 'ITOP_URL') }}"
        method: POST
        body_format: form-urlencoded
        body:
          auth_token: "{{ lookup('env', 'ITOP_TOKEN') }}"
          json_data: >
            {
              "operation": "core/get",
              "class": "UserRequest",
              "key": "SELECT UserRequest WHERE status='resolved' AND service_name='Network Automation'",
              "output_fields": "id, title, description, function_alc_cis_list"
            }
      register: itop_response

    - name: Trigger Workflow if ticket exists
      ansible.builtin.debug:
        msg: "Found Ticket: {{ item.fields.id }}. Triggering Workflow now..."
      loop: "{{ itop_response.json.objects | dict2items | map(attribute='value') | list }}"
      when:
        - itop_response.json.code == 0
        - itop_response.json.objects is not none

    - name: Trigger the 1LINK Network Workflow
      awx.awx.workflow_launch:
        name: "1LINK Workflow Template"
        inventory: "iTop Managed Network"
        extra_vars:
          itop_ticket_id: "{{ item.fields.id }}"
          vlan_id: "{{ item.fields.description.split(',')[0] }}"
          vlan_name: "{{ item.fields.description.split(',')[1] }}"
          change_type: "create_vlan"
      loop: "{{ itop_response.json.objects | dict2items | map(attribute='value') | list }}"
      when:
        - itop_response.json.code == 0
        - itop_response.json.objects is not none
