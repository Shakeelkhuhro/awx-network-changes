---
- name: Poll iTop for Resolved Tickets
  hosts: localhost
  connection: local
  gather_facts: no

  tasks:
    - name: Get Resolved User Requests from iTop
      ansible.builtin.uri:
        url: "http://172.25.115.72/itop/webservices/rest.php?version=1.3"
        method: POST
        body_format: form-urlencoded
        body:
          auth_token: "{{ lookup('env', 'ITOP_TOKEN') }}"
          json_data: >
            {
              "operation": "core/get",
              "class": "UserRequest",
              "key": "SELECT UserRequest WHERE status='resolved'",
              "output_fields": "id, title, description"
            }
      register: itop_response

    - name: Trigger Workflow via Direct API
      ansible.builtin.uri:
        url: "http://10.43.90.93/api/v2/workflow_job_templates/10/launch/"
        method: POST
        user: "admin"
        password: "Admin@123"
        force_basic_auth: yes
        status_code: 201
        body_format: json
        body: >
          {
            "inventory": 4,
            "extra_vars": {
              "itop_ticket_id": "{{ item.fields.id }}",
              "change_type": "{% if 'vlan' in item.fields.title | lower and 'delete' not in item.fields.title | lower %}create_vlan{% elif 'delete' in item.fields.title | lower %}delete_vlan{% elif 'up' in item.fields.title | lower %}interface_up{% elif 'down' in item.fields.title | lower %}interface_down{% else %}update_description{% endif %}",
              "vlan_id": {{ item.fields.title | regex_replace('[^0-9]', '') | default(1) | int }},
              "vlan_name": "{{ item.fields.title | replace(' ', '_') }}",
              "interface_name": "GigabitEthernet1/0/1",
              "interface_description": "{{ item.fields.title }}"
            }
          }
      loop: "{{ itop_response.json.objects | dict2items | map(attribute='value') | list }}"
      when: 
        - itop_response.json.code == 0 
        - itop_response.json.objects is not none
