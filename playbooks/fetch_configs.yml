---
- name: "FETCH: Pull Live Configs for Batfish"
  hosts: all
  gather_facts: no
  tasks:
    - name: "Ensure Local Directory Structure"
      delegate_to: localhost
      file:
        path: "/tmp/batfish_snapshot/configs"
        state: directory
        mode: '0755'

    - name: "Get Running Config from Switch"
      cisco.ios.ios_command:
        commands: "show running-config"
      register: live_cfg
      when: "'cisco' in group_names"

    - name: "Save Config to Local File"
      delegate_to: localhost
      copy:
        content: "{{ live_cfg.stdout[0] }}"
        dest: "/tmp/batfish_snapshot/configs/{{ inventory_hostname }}.cfg"
      when: live_cfg.stdout is defined
