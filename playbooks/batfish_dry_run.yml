---
- name: "PRE-REQUISITES: Prepare AWX Runner"
  hosts: localhost
  connection: local
  gather_facts: no
  tasks:
    - name: "Install PyBatfish Python Library"
      ansible.builtin.pip:
        name: pybatfish

- name: "BATFISH: Dry Run & Impact Analysis"
  hosts: localhost
  connection: local
  gather_facts: no
  tasks:
    - name: "SIMULATION: Run Reachability Dry Run"
      ansible.builtin.shell: |
        python3 -c "
        from pybatfish.client.commands import bf_init_snapshot, bf_set_network, bf_session
        from pybatfish.question import bfq
        
        bf_session.host = 'localhost'
        bf_set_network('1link_prod')
        bf_init_snapshot('/tmp/batfish_snapshot/', name='proposed_change', overwrite=True)
        
        # Check if traffic is dropped as expected (Simulation)
        result = bfq.testFilters(headers={'dstIps': '8.8.8.8'}).answer().frame()
        print(result)
        "
      register: simulation_result

    - name: "DRY RUN SUMMARY"
      ansible.builtin.debug:
        msg: >
          IMPACT ANALYSIS:
          Requested Action: {{ change_type | default('Manual_Check') }}
          Status: Batfish simulation complete.
          Prediction: The configuration is syntactically valid and loaded into the Digital Twin.
