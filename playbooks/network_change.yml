---
- name: 1LINK Multi-Action Network Automation
  hosts: all
  gather_facts: no
  connection: network_cli

  tasks:
    - name: Handle VLAN Changes (Create/Update)
      cisco.ios.ios_vlans:
        state: merged
        config:
          - name: "{{ vlan_name | default('VLAN_' ~ vlan_id) }}"
            vlan_id: "{{ vlan_id | int }}"
      when: change_type in ['create_vlan', 'update_vlan']

    - name: Handle VLAN Deletion
      cisco.ios.ios_vlans:
        state: deleted
        config:
          - vlan_id: "{{ vlan_id | int }}"
      when: change_type == 'delete_vlan'

    - name: Handle Interface Up/Down
      cisco.ios.ios_interfaces:
        config:
          - name: "{{ interface_name }}"
            enabled: "{{ 'yes' if change_type == 'interface_up' else 'no' }}"
      when: change_type in ['interface_up', 'interface_down']

    - name: Update Interface Description
      cisco.ios.ios_config:
        lines:
          - "description {{ interface_description | replace(' ', '_') }}"
        parents: "interface {{ interface_name }}"
      when: change_type == 'update_description'

# -----------------------------------
# FINAL FEEDBACK LOOP
# -----------------------------------
- name: Close iTop Ticket
  hosts: localhost
  gather_facts: no
  tasks:
    - name: Final iTop Closure
      ansible.builtin.uri:
        url: "http://172.25.115.72/itop/webservices/rest.php?version=1.3"
        method: POST
        body_format: form-urlencoded
        body:
          auth_token: "{{ lookup('env', 'ITOP_TOKEN') }}"
          json_data: >
            {
              "operation": "core/update",
              "class": "UserRequest",
              "key": "{{ itop_ticket_id }}",
              "fields": {
                "status": "closed",
                "solution": "Successfully applied {{ change_type }} via AWX Direct-to-Switch flow."
              }
            }
