---
- name: "1LINK Multi-Action Network Automation"
  hosts: all
  gather_facts: no
  connection: network_cli
  
  vars:
    ansible_network_os: cisco.ios.ios

  tasks:
    - name: "ACTION: Create or Update VLAN"
      cisco.ios.ios_vlans:
        state: merged
        config:
          - name: "{{ vlan_name | default('VLAN_' ~ vlan_id) }}"
            vlan_id: "{{ vlan_id | int }}"
      register: vlan_create_result
      when: change_type in ['create_vlan', 'update_vlan']

    - name: "ACTION: Delete VLAN"
      cisco.ios.ios_config:
        lines:
          - "no vlan {{ vlan_id }}"
      register: vlan_delete_result
      when: change_type == 'delete_vlan'

    - name: "ACTION: Interface Up/Down"
      cisco.ios.ios_interfaces:
        config:
          - name: "{{ interface_name }}"
            enabled: "{{ true if change_type == 'interface_up' else false }}"
      register: int_status_result
      when: change_type in ['interface_up', 'interface_down']

    - name: "ACTION: Update Interface Description"
      cisco.ios.ios_config:
        lines:
          - "description {{ interface_description | replace(' ', '_') }}"
        parents: "interface {{ interface_name }}"
      register: desc_result
      when: change_type == 'update_description'

    - name: "SUMMARY: Show Change Applied to Switch"
      ansible.builtin.debug:
        msg: >-
          {% if change_type == 'create_vlan' %}[SUCCESS] Created VLAN {{ vlan_id }} named {{ vlan_name }}
          {% elif change_type == 'delete_vlan' %}[SUCCESS] Deleted VLAN {{ vlan_id }}
          {% elif change_type == 'interface_up' %}[SUCCESS] Port {{ interface_name }} is now UP
          {% elif change_type == 'interface_down' %}[SUCCESS] Port {{ interface_name }} is now DOWN
          {% else %}[SUCCESS] Applied change: {{ change_type }}{% endif %}

# -----------------------------------
# FINAL FEEDBACK LOOP
# -----------------------------------
- name: "Close iTop Ticket"
  hosts: localhost
  connection: local
  gather_facts: no
  tasks:
    - name: "Final iTop Closure"
      ansible.builtin.uri:
        url: "http://172.25.115.72/itop/webservices/rest.php?version=1.3"
        method: POST
        body_format: form-urlencoded
        body:
          auth_token: "{{ lookup('env', 'ITOP_TOKEN') }}"
          # Simplified JSON structure to bypass "Unknown attribute" errors
          json_data: "{{ {
            'operation': 'core/update',
            'class': 'UserRequest',
            'key': itop_ticket_id,
            'comment': '1LINK Automation finalized the change on the network.',
            'fields': {
              'status': 'closed',
              'solution': 'Successfully executed ' ~ change_type ~ ' for resource ' ~ (vlan_id | default(interface_name) | string) ~ '. Change verified on device.'
            }
          } | to_json }}"
      register: closure_result
      when: itop_ticket_id is defined

    - name: "Debug iTop Closure Response"
      ansible.builtin.debug:
        var: closure_result.json
