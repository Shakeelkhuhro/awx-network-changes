---
- name: 1LINK Network Change Automation
  hosts: all
  gather_facts: no

  tasks:

  # ---------------------------
  # CAPTURE STATE (for rollback)
  # ---------------------------

    - name: Get current interface config
      raw: "show running-config interface {{ interface_name }}"
      register: current_int
      when: change_type == "update_description"

    - name: Extract previous description
      set_fact:
        previous_description: >-
          {{
            (current_int.stdout_lines
            | select("search", "^ description")
            | list
            | first
            | default("description NONE"))
            | regex_replace("^ description ", "")
          }}
      when: change_type == "update_description"

  # ---------------------------
  # EXECUTION
  # ---------------------------

    - name: Create VLAN
      raw: |
        configure terminal
        vlan {{ vlan_id }}
        name {{ vlan_name }}
        exit
        end
      when: change_type == "create_vlan"

    - name: Verify VLAN Created
      raw: "show vlan id {{ vlan_id }}"
      register: vlan_check
      when: change_type == "create_vlan"

    - name: Fail if VLAN not created
      fail:
        msg: "VLAN {{ vlan_id }} creation failed"
      when:
        - change_type == "create_vlan"
        - "'not found' in vlan_check.stdout"

    - name: Delete VLAN
      raw: |
        configure terminal
        no vlan {{ vlan_id }}
        end
      when: change_type == "delete_vlan"

    - name: Verify VLAN Deleted
      raw: "show vlan id {{ vlan_id }}"
      register: vlan_delete_check
      when: change_type == "delete_vlan"

    - name: Fail if VLAN still exists
      fail:
        msg: "VLAN {{ vlan_id }} deletion failed"
      when:
        - change_type == "delete_vlan"
        - "'not found' not in vlan_delete_check.stdout"

    - name: Interface Up
      raw: |
        configure terminal
        interface {{ interface_name }}
        no shutdown
        end
      when: change_type == "interface_up"

    - name: Interface Down
      raw: |
        configure terminal
        interface {{ interface_name }}
        shutdown
        end
      when: change_type == "interface_down"

    - name: Update Interface Description
      raw: |
        configure terminal
        interface {{ interface_name }}
        description {{ interface_description }}
        end
      when: change_type == "update_description"

  # ---------------------------
  # FINAL OUTPUT (ONLY RELEVANT)
  # ---------------------------

    - name: Show VLAN Result
      raw: "show vlan id {{ vlan_id }}"
      register: final_vlan
      when: change_type in ["create_vlan", "delete_vlan"]

    - name: Print VLAN Result
      debug:
        msg: "{{ final_vlan.stdout }}"
      when: change_type in ["create_vlan", "delete_vlan"]

    - name: Show Interface Result
      raw: "show running-config interface {{ interface_name }}"
      register: final_int
      when: change_type in ["interface_up", "interface_down", "update_description"]

    - name: Print Interface Result
      debug:
        msg: "{{ final_int.stdout }}"
      when: change_type in ["interface_up", "interface_down", "update_description"]
