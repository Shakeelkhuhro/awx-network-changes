# playbooks/network_change.yml
---
- name: 1LINK Network Change Automation
  hosts: all
  gather_facts: no
  connection: network_cli

  tasks:

    # ---------------------------
    # CAPTURE STATE FOR ROLLBACK
    # ---------------------------

    - name: Capture interface config before description update
      cisco.ios.ios_command:
        commands:
          - show running-config interface {{ interface_name }}
      register: current_int
      when: change_type == 'update_description'

    - name: Save previous description
      set_fact:
        previous_description: >-
          {{
            (
              current_int.stdout[0].split('\n')
              | select('search', '^ description')
              | list
              | first
              | default('description NONE')
            ) | regex_replace('^ description ', '')
          }}
      when: change_type == 'update_description'

    # ---------------------------
    # EXECUTION
    # ---------------------------

    - name: Create VLAN
      cisco.ios.ios_config:
        lines:
          - name {{ vlan_name | default('VLAN_' ~ vlan_id) | replace(' ', '_') }}
        parents: vlan {{ vlan_id }}
      when: change_type == 'create_vlan'

    - name: Verify VLAN Created
      cisco.ios.ios_command:
        commands:
          - show vlan id {{ vlan_id }}
      register: vlan_result
      when: change_type == 'create_vlan'

    - name: Delete VLAN
      cisco.ios.ios_config:
        lines:
          - no vlan {{ vlan_id }}
      when: change_type == 'delete_vlan'

    - name: Interface Up
      cisco.ios.ios_config:
        lines:
          - no shutdown
        parents: interface {{ interface_name }}
      when: change_type == 'interface_up'

    - name: Interface Down
      cisco.ios.ios_config:
        lines:
          - shutdown
        parents: interface {{ interface_name }}
      when: change_type == 'interface_down'

    - name: Update Interface Description
      cisco.ios.ios_config:
        lines:
          - description {{ interface_description | replace(' ', '_') }}
        parents: interface {{ interface_name }}
      when: change_type == 'update_description'

    # ---------------------------
    # RESULT OUTPUT
    # ---------------------------

    - name: Show VLAN Result
      debug:
        msg: "{{ vlan_result.stdout[0] }}"
      when: change_type == 'create_vlan'
