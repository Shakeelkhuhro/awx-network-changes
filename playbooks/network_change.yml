---
- name: 1LINK Network Change Automation
  hosts: all
  gather_facts: no
  connection: network_cli

  tasks:

  # ---------------------------
  # VLAN CREATE
  # ---------------------------

    - name: Create VLAN
      cisco.ios.ios_config:
        lines:
          - name {{ vlan_name }}
        parents: vlan {{ vlan_id }}
      when: change_type == "create_vlan"

    - name: Verify VLAN
      cisco.ios.ios_command:
        commands:
          - show vlan id {{ vlan_id }}
      register: vlan_output
      when: change_type == "create_vlan"

    - name: Fail if VLAN not created
      fail:
        msg: "VLAN {{ vlan_id }} creation failed"
      when:
        - change_type == "create_vlan"
        - "'not found' in vlan_output.stdout[0]"

  # ---------------------------
  # VLAN DELETE
  # ---------------------------

    - name: Delete VLAN
      cisco.ios.ios_config:
        lines:
          - no vlan {{ vlan_id }}
      when: change_type == "delete_vlan"

  # ---------------------------
  # INTERFACE UP
  # ---------------------------

    - name: Interface Up
      cisco.ios.ios_config:
        lines:
          - no shutdown
        parents: interface {{ interface_name }}
      when: change_type == "interface_up"

  # ---------------------------
  # INTERFACE DOWN
  # ---------------------------

    - name: Interface Down
      cisco.ios.ios_config:
        lines:
          - shutdown
        parents: interface {{ interface_name }}
      when: change_type == "interface_down"

  # ---------------------------
  # DESCRIPTION UPDATE
  # ---------------------------

    - name: Update Description
      cisco.ios.ios_config:
        lines:
          - description {{ interface_description }}
        parents: interface {{ interface_name }}
      when: change_type == "update_description"

  # ---------------------------
  # CLEAN OUTPUT
  # ---------------------------

    - name: Show VLAN Result
      cisco.ios.ios_command:
        commands:
          - show vlan id {{ vlan_id }}
      register: final_vlan
      when: change_type in ["create_vlan", "delete_vlan"]

    - name: Print VLAN
      debug:
        msg: "{{ final_vlan.stdout[0] }}"
      when: change_type in ["create_vlan", "delete_vlan"]
