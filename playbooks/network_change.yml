---
- name: 1LINK Multi-Action Network Automation
  hosts: all
  gather_facts: no
  connection: network_cli

  tasks:
    # ---------------------------
    # EXECUTION LOGIC
    # ---------------------------

    - name: Create VLAN
      cisco.ios.ios_config:
        lines: ["name {{ vlan_name | default('VLAN_' ~ vlan_id) | replace(' ', '_') }}"]
        parents: "vlan {{ vlan_id }}"
      when: change_type == 'create_vlan'

    - name: Delete VLAN
      cisco.ios.ios_config:
        lines: ["no vlan {{ vlan_id }}"]
      when: change_type == 'delete_vlan'

    - name: Update VLAN (Rename)
      cisco.ios.ios_config:
        lines: ["name {{ vlan_name | replace(' ', '_') }}"]
        parents: "vlan {{ vlan_id }}"
      when: change_type == 'update_vlan'

    - name: Interface Up
      cisco.ios.ios_config:
        lines: [no shutdown]
        parents: "interface {{ interface_name }}"
      when: change_type == 'interface_up'

    - name: Interface Down
      cisco.ios.ios_config:
        lines: [shutdown]
        parents: "interface {{ interface_name }}"
      when: change_type == 'interface_down'

    - name: Update Interface Description
      cisco.ios.ios_config:
        lines: ["description {{ interface_description | replace(' ', '_') }}"]
        parents: "interface {{ interface_name }}"
      when: change_type == 'update_description'

# -----------------------------------
# CLOSE ITOP TICKET
# -----------------------------------
- name: Close iTop Ticket on Success
  hosts: localhost
  gather_facts: no
  tasks:
    - name: Finalize Ticket in iTop
      ansible.builtin.uri:
        url: "{{ lookup('env', 'ITOP_URL') | default('http://172.25.115.72/itop/webservices/rest.php?version=1.3', true) }}"
        method: POST
        body_format: form-urlencoded
        body:
          auth_token: "{{ lookup('env', 'ITOP_TOKEN') }}"
          json_data: >
            {
              "operation": "core/update",
              "class": "UserRequest",
              "key": "{{ itop_ticket_id }}",
              "comment": "AWX Automation: {{ change_type }} executed successfully.",
              "fields": {
                "status": "closed",
                "solution": "Successfully completed {{ change_type }} for Target ID: {{ vlan_id | default(interface_name) }}."
              }
            }
